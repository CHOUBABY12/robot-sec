name: Comparer à nouveau (sans recalculer les signaux)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Numéro d'une exécution « Optimisation » dont on réutilise les signaux"
        required: true
      coupure:
        description: "Début de la période de vérification"
        default: "2025-01-01"
      candidat:
        description: "Variante à détailler (note|entrée|sessions|gestion|validité)"
        default: "A|auto|hors Asie|BE au TP1|8"

permissions:
  contents: write
  actions: read

jobs:
  comparer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: signaux-*
          merge-multiple: true
          path: signaux
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Comparaison
        run: python comparer.py --coupure "${{ inputs.coupure }}" --candidat "${{ inputs.candidat }}"
      - name: Enregistrer le rapport
        run: |
          git config user.name "robot-smc"
          git config user.email "robot-smc@users.noreply.github.com"
          git add -f rapports/optimisation.md rapports/optimisation.json
          git diff --cached --quiet || (git commit -m "Rapport d'optimisation" && git pull --rebase -q && git push)
