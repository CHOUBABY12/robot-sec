name: Robot SMC Or

on:
  schedule:
    - cron: "7 * * * 0-5"   # relance chaque heure si besoin (dimanche → vendredi, UTC)
  workflow_dispatch:            # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: robot-smc
  cancel-in-progress: false   # une seule session à la fois, la suivante attend

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test Telegram (lancement manuel seulement)
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python robot.py --test-telegram
      - name: Analyse de l'or + alerte Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # GitHub retarde souvent les tâches programmées : le robot reste donc
        # allumé ~5h40 par session et analyse lui-même toutes les 15 minutes.
        run: timeout 20400 python robot.py --boucle 15 --sans-graphique || true
      - name: Mémoriser la dernière alerte (évite les doublons)
        run: |
          git config user.name "robot-smc"
          git config user.email "robot-smc@users.noreply.github.com"
          for f in rapports/derniere_alerte.txt rapports/dernier_resume.txt; do [ -f "$f" ] && git add -f "$f"; done; true
          git diff --cached --quiet || (git commit -m "Mémoire des alertes" && git pull --rebase -q && git push)
