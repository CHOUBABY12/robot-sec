name: Analyse maintenant (sans alerte)

on:
  workflow_dispatch:   # bouton « Run workflow » : une analyse immédiate, lisible dans le journal

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Annonces économiques de la semaine
        run: python robot.py --test-news
      - name: Analyse de l'or
        run: python robot.py --sans-graphique
